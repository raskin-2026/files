name: Weekly NSE update
on:
  schedule:
    - cron: "30 11 * * 5"   # Friday 17:00 IST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/fetch_nse.py
      - run: |
          git config user.name "takapoisa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/weekly.json
          git diff --staged --quiet || (git commit -m "Weekly NSE data" && git push)
